<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Typing Test</title>
    <style>
        /* --- General Styling & Animations (Point 7) --- */
        :root {
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --correct-color: #4ec9b0;
            --incorrect-color: #f44747;
            --cursor-color: #ffffff;
            --current-word-bg: rgba(255, 255, 255, 0.1);
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #252526;
        }

        /* --- UI Elements --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 1.2em;
        }
        .stat-item span {
            font-weight: bold;
            color: var(--correct-color);
        }

        .modes {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .modes button {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .modes button:hover {
            background-color: #3c3c3c;
        }
        .modes button.active {
            background-color: var(--correct-color);
            color: var(--bg-color);
            border-color: var(--correct-color);
        }

        /* --- Typing Area (Points 3 & 4) --- */
        .typing-wrapper {
            position: relative;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5em;
            line-height: 1.8;
        }

        #typing-display {
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
            user-select: none; /* Prevents text selection which feels weird */
            min-height: 150px;
        }
        
        #typing-display .char {
            position: relative;
            transition: color 0.1s, background-color 0.1s;
        }

        #typing-display .char.correct {
            color: var(--correct-color);
        }

        #typing-display .char.incorrect {
            color: var(--incorrect-color);
            background-color: rgba(244, 71, 71, 0.2);
            animation: error-shake 0.3s ease-out; /* Subtle error animation */
        }

        #typing-display .char.current-word {
            background-color: var(--current-word-bg);
            border-radius: 3px;
        }

        #typing-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 15px;
            border: 1px solid transparent;
            border-radius: 4px;
            background-color: transparent;
            color: transparent;
            caret-color: transparent; /* Hide default cursor */
            font-family: 'Courier New', Courier, monospace;
            font-size: 1em; /* Inherited from wrapper */
            line-height: 1.8; /* Match display */
            resize: none;
            overflow: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            z-index: 10;
        }

        #typing-input:focus {
            outline: none;
        }
        
        #typing-input:focus + #typing-display {
            outline: 2px solid var(--correct-color);
            outline-offset: -2px;
        }

        #cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: var(--cursor-color);
            position: absolute;
            top: 15px;
            animation: blink 1s infinite;
            pointer-events: none;
            z-index: 11;
        }

        /* --- Animations --- */
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes error-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        /* --- Results Screen (Point 8) --- */
        #results {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        #results h2 {
            margin-top: 0;
            color: var(--correct-color);
        }
        #results .metric {
            margin-bottom: 10px;
        }
        #results .heatmap {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        #results .key {
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
        }
        #results .key.error {
            background-color: var(--incorrect-color);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Pro Typing Test</h1>
            <div class="stats">

            <button id="restart-btn">Restart</button>

        <div class="typing-wrapper">
            <textarea id="typing-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
            <div id="typing-display"></div>
            <span id="cursor"></span>
        </div>

        <div id="results">
            <h2>Test Complete</h2>

            <div class="metric">Consistency: <span id="final-consistency"></span>%</div>
            <div class="metric">Worst Keys (by error rate): <span id="worst-keys"></span></div>
            <div class="metric">Error Heatmap:</div>
            <div id="heatmap" class="heatmap"></div>
        </div>
    </div>

, "step", "still", "stock", "stop", "store", "story", "strategy", "street", "strong", "structure", "student", "study", "stuff", "style", "subject", "succeed", "success", "successful", "such", "suddenly", "suffer", "suggest", "summer", "support", "suppose", "sure", "surface", "system", "table", "take", "talk", "task", "tax", "teach", "teacher", "team", "technology", "television", "tell", "temperature", "test", "than", "thank", "that", "the", "their", "them", "themselves", "then", "theory", "there", "these", "they", "thing", "think", "third", "this", "those", "though", "thought", "thousand", "threat", "three", "through", "throughout", "throw", "thus", "time", "today", "together", "tomorrow", "tone", "tongue", "tonight", "too", "tool", "top", "total", "tough", "toward", "town", "trade", "traditional", "traffic", "training", "travel", "treat", "treatment", "tree", "trial", "trip", "trouble", "truck", "true", "truly", "trust", "truth", "try", "turn", "TV", "type", "under", "understand", "unit", "until", "upon", "use", "usual", "usually", "value", "various", "very", "victim", "view", "violence", "visit", "voice", "vote", "wait", "walk", "wall", "want", "war", "watch", "water", "way", "we", "weapon", "wear", "week", "weight", "feel", "well", "west", "western", "what", "whatever", "when", "where", "whether", "which", "while", "white", "whole", "whom", "whose", "why", "wide", "wife", "will", "win", "wind", "window", "wish", "with", "within", "without", "woman", "wonder", "wood", "word", "work", "worker", "world", "worry", "would", "write", "writer", "wrong", "yard", "yeah", "year", "yes", "yet", "you", "young", "your", "yourself"];

    // --- Core Classes (Consolidated from previous breakdown) ---

    /**
     * Handles all rendering of the text, cursor, and highlights.
     * (Points 3 & 4)
     */
    class TextRenderer {
        render(state, userInput) {
            let html = '';
            for (let i = 0; i < state.originalText.length; i++) {
                const char = state.originalText[i];
                let className = 'char';
                let charText = char;

                if (i < userInput.length) {
                    // Typed character
                    const typedChar = userInput[i];
                    if (typedChar === char) {
                        className += ' correct';
                    } else {
                        className += ' incorrect';
                    }
                } else if (i === userInput.length) {
                    // Current character to be typed
                    // Highlight current word
                    const wordStart = state.originalText.lastIndexOf(' ', i - 1) + 1;
                    const wordEnd = state.originalText.indexOf(' ', i);
                    const currentWordEnd = wordEnd === -1 ? state.originalText.length : wordEnd;

                    if (i >= wordStart && i < currentWordEnd) {
                        // We'll add the 'current-word' class to the whole word
                        // This is handled in a second pass for simplicity
                    }
                }

                html += `<span class="${className}" data-index="${i}">${charText}</span>`;
            }

            // Second pass to add 'current-word' class
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            const spans = tempDiv.querySelectorAll('span');
            const currentWordStart = state.originalText.lastIndexOf(' ', userInput.length - 1) + 1;
            const currentWordEnd = state.originalText.indexOf(' ', userInput.length);
            const end = currentWordEnd === -1 ? state.originalText.length : currentWordEnd;

            for (let i = currentWordStart; i < end; i++) {
                spans[i].classList.add('current-word');
            }

            typingDisplay.innerHTML = tempDiv.innerHTML;
            this.updateCursorPosition(userInput);
        }

        updateCursorPosition(userInput) {

            } else { // End of line
                 const lastChar = typingDisplay.querySelector(`span.char[data-index="${userInput.length - 1}"]`);
                 if (lastChar) {
                    const rect = lastChar.getBoundingClientRect();
                    const parentRect = typingDisplay.getBoundingClientRect();
                    cursor.style.left = `${rect.right - parentRect.left}px`;
                    cursor.style.top = `${rect.top - parentRect.top}px`;
                 }
            }
        }

    /**
     * Handles WPM and accuracy calculations.
     * (Point 1)
     */
    class StatsCalculator {
        constructor() {
            this.correctChars = 0;
            this.incorrectChars = 0;
            this.totalChars = 0;
            this.wpmHistory = [];
        }

        recordKeystroke(isCorrect) {
            this.totalChars++;
            if (isCorrect) {
                this.correctChars++;
            } else {
                this.incorrectChars++;
            }
        }

        calculate(state) {
            if (!state.startTime) return { wpm: 0, rawWpm: 0, accuracy: 100 };

            const timeElapsed = (Date.now() - state.startTime) / 1000 / 60; // in minutes
            if (timeElapsed < 0.01) return { wpm: 0, rawWpm: 0, accuracy: 100 };

            const wordsTyped = this.totalChars / 5;
            const rawWpm = Math.round(wordsTyped / timeElapsed);
            const netWpm = Math.round((this.correctChars / 5) / timeElapsed);
            const accuracy = this.totalChars > 0 ? Math.round((this.correctChars / this.totalChars) * 100) : 100;

            // Store WPM for consistency calculation
            if (state.isTestActive) {
                this.wpmHistory.push(netWpm);
            }

            return { wpm: netWpm, rawWpm, accuracy };
        }

        calculateConsistency() {
            if (this.wpmHistory.length < 2) return 100;
            const avg = this.wpmHistory.reduce((a, b) => a + b, 0) / this.wpmHistory.length;
            const variance = this.wpmHistory.reduce((sum, wpm) => sum + Math.pow(wpm - avg, 2), 0) / this.wpmHistory.length;
            const stdDev = Math.sqrt(variance);
            return Math.max(0, Math.round(100 - (stdDev / avg) * 100));
        }
        
        getFinalReport() {
            return {
                consistency: this.calculateConsistency(),
                accuracy: this.totalChars > 0 ? Math.round((this.correctChars / this.totalChars) * 100) : 100,
                // ... other metrics can be added here
            };
        }
    }

    /**
     * Handles all logic related to test modes and completion.
     * (Point 5)
     */
    class TestModeController {
        constructor() {
            this.mode = 'fixed-time';
            this.options = { seconds: 60 };
        }

        set(mode, options = {}) {
            this.mode = mode;
            this.options = options;
        }

        checkCompletion(state, stats, userInput) {
            const timeElapsed = (Date.now() - state.startTime) / 1000;
            const wordsTyped = userInput.trim().split(/\s+/).length;

            switch (this.mode) {
                case 'fixed-time':
                    return timeElapsed >= this.options.seconds;
                case 'word-count':
                    return wordsTyped >= this.options.words;
                case 'sudden-death':
                    return stats.incorrectChars > 0;
                default:
                    return false;
            }
        }
    }
    
    /**
     * Collects detailed metrics for the results screen.
     * (Point 8)
     */
    class MetricsCollector {
        constructor() {
            this.errorLog = [];
        }

        logError(expected, actual, index) {
            this.errorLog.push({ expected, actual, index });
        }

        generateHeatmap() {
            const keyCounts = {};
            const errorCounts = {};
            const allChars = appState.originalText.replace(/\s/g, ''); // ignore spaces

            allChars.split('').forEach(char => {
                const lowerChar = char.toLowerCase();
                keyCounts[lowerChar] = (keyCounts[lowerChar] || 0) + 1;
            });

            this.errorLog.forEach(error => {
                const lowerChar = error.expected.toLowerCase();
                errorCounts[lowerChar] = (errorCounts[lowerChar] || 0) + 1;
            });
            
            const heatmap = {};
            for (const key in keyCounts) {
                const errors = errorCounts[key] || 0;
                heatmap[key] = errors / keyCounts[key];
            }
            return heatmap;
        }
    }


    // --- Instantiate Classes ---
    const renderer = new TextRenderer();
    const calculator = new StatsCalculator();
    const modeController = new TestModeController();
    const metrics = new MetricsCollector();

    // --- Main Application Logic ---

    function initializeTest() {
        // Reset state
        appState = {
            ...appState,
            originalText: generateText(),
            startTime: null,
            isTestActive: false,
        };
        calculator.correctChars = 0;
        calculator.incorrectChars = 0;
        calculator.totalChars = 0;
        calculator.wpmHistory = [];
        metrics.errorLog = [];

        // Reset UI
        renderer.render(appState, '');
        updateStatsDisplay({ wpm: 0, rawWpm: 0, accuracy: 100 });
        resultsDiv.style.display = 'none';
        typingInput.value = '';
        
        // Focus on the input field
        typingInput.focus();
    }

    function generateText() {
        // For word-count mode, generate random words
        if (modeController.mode === 'word-count') {
            const wordsNeeded = modeController.options.words;
            let text = [];
            for (let i = 0; i < wordsNeeded; i++) {
                text.push(WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)]);
            }
            return text.join(' ');
        }
        // For other modes, use a predefined text
        return TEXTS[Math.floor(Math.random() * TEXTS.length)];
    }

    function startTest() {
        if (appState.isTestActive) return;
        appState.isTestActive = true;
        appState.startTime = Date.now();

        // Update stats every 250ms
        appState.timerInterval = setInterval(() => {
            const stats = calculator.calculate(appState);
            updateStatsDisplay(stats);
            
            if (modeController.checkCompletion(appState, stats, typingInput.value)) {
                endTest();
            }
        }, 250);
    }

    function handleInput() {
        const userInput = typingInput.value;

        // Start test on first valid input
        if (!appState.isTestActive && userInput.length > 0) {
            startTest();
        }
        if (!appState.isTestActive) return;
        
        // Prevent typing past the end of the text
        if (userInput.length > appState.originalText.length) {
            typingInput.value = userInput.slice(0, appState.originalText.length);
            return;
        }

        // Re-calculate stats from scratch to handle backspaces correctly
        calculator.correctChars = 0;
        calculator.incorrectChars = 0;
        calculator.totalChars = userInput.length;
        metrics.errorLog = [];

        for (let i = 0; i < userInput.length; i++) {
            if (userInput[i] === appState.originalText[i]) {
                calculator.correctChars++;
            } else {
                calculator.incorrectChars++;
                metrics.logError(appState.originalText[i], userInput[i], i);
            }
        }

        renderer.render(appState, userInput);
    }

    function updateStatsDisplay(stats) {
        wpmDisplay.textContent = stats.wpm;
        rawWpmDisplay.textContent = stats.rawWpm;
        accuracyDisplay.textContent = stats.accuracy;
    }

    function endTest() {
        appState.isTestActive = false;
        clearInterval(appState.timerInterval);
        typingInput.blur(); // Remove focus

        const finalStats = calculator.calculate(appState);
        const report = calculator.getFinalReport();
        const heatmap = metrics.generateHeatmap();
        
        // Display results
        document.getElementById('final-wpm').textContent = finalStats.wpm;
        document.getElementById('final-raw-wpm').textContent = finalStats.rawWpm;
        document.getElementById('final-accuracy').textContent = report.accuracy;
        document.getElementById('final-consistency').textContent = report.consistency;
        
        // Display worst keys
        const sortedKeys = Object.entries(heatmap)
            .sort(([,a], [,b]) => b - a)
            .slice(0, 5)
            .map(([key, rate]) => `${key.toUpperCase()} (${(rate*100).toFixed(0)}%)`)
            .join(', ');
        document.getElementById('worst-keys').textContent = sortedKeys || 'N/A';

        // Display heatmap
        const heatmapContainer = document.getElementById('heatmap');
        heatmapContainer.innerHTML = '';
        'abcdefghijklmnopqrstuvwxyz'.split('').forEach(key => {
            const keyDiv = document.createElement('div');
            keyDiv.className = 'key';
            keyDiv.textContent = key.toUpperCase();
            if (heatmap[key] > 0) {
                keyDiv.classList.add('error');
                keyDiv.title = `Error Rate: ${(heatmap[key] * 100).toFixed(1)}%`;
            }
            heatmapContainer.appendChild(keyDiv);
        });

        resultsDiv.style.display = 'block';
    }

    // --- Event Listeners ---
    typingInput.addEventListener('input', handleInput);
    restartBtn.addEventListener('click', initializeTest);

    modeButtons.forEach(button => {
        button.addEventListener('click', () => {
            modeButtons.forEach(b => b.classList.remove('active'));
            button.classList.add('active');
            
            const mode = button.dataset.mode;
            const options = button.dataset.options ? { [mode === 'fixed-time' ? 'seconds' : 'words']: parseInt(button.dataset.options) } : {};
            
            modeController.set(mode, options);
            initializeTest();
        });
    });

    // Initial setup
    initializeTest();
    // Set default mode button to active
    document.querySelector('button[data-options="60"]').classList.add('active');

});
</script>
